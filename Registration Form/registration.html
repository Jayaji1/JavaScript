<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>
  <body>
    <header>
      <h1>Student Registration Form</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Course</a>
        <a href="registration.html">Registration</a>
        <a href="contact.html">Contact</a>
      </nav>

      <main>
        <form>
          <fieldset>
            <legend>Personal Infromation</legend>

            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your Name"
              required
            />
            <br /><br />

            <label for="email">Email</label>
            <input
              type="email"
              id="name"
              name="email"
              placeholder="Enter Your Email"
            />
            <br /><br />

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
            <br /><br />

            <label for="dob">Date of Birth</label>
            <input type="dob" id="dob" name="dob" required />
            <br /><br />

            <label for="phone">Phone Number:</label>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter 10 digit number"
              pattern="[0-9]{10}"
              required
            />
            <br /><br />

            <label for="age">Age:</label>
            <input
              type="number"
              id="age"
              name="age"
              min="17"
              max="30"
              required
            />
            <br><br>
            <label for="marks">12th Percentage:</label>

           <input
            type="number"
            id="marks"
            name="marks"
            min="0"
            max="100"
            step="0.01"
            placeholder="Enter percentage"
            required>
           </fieldset>

          <fieldset>
            <legend>Gender</legend>
            <input type="radio" name="gender" id="male" value="male" />
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female" />
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other" />
            <label for="other">Other</label>
          </fieldset>

          <fieldset>
            <legend>Skills</legend>

            <input type="checkbox" id="java" name="skills" value="java" />

            <label for="java">Java</label>

            <input type="checkbox" id="python" name="skills" value="python" />

            <label for="python">Python</label>

            <input type="checkbox" id="html" name="skills" value="html" />

            <label for="html">HTML</label>

            <input type="checkbox" id="mysql" name="skills" value="mysql" />

            <label for="mysql">MySQL</label>
          </fieldset>

          <fieldset>
            <legend>Course Information</legend>

            <label for="course">Select Course:</label>

            <select id="course" name="course" required>
              <option value="">-- Select Course --</option>

              <option value="cs">Computer Science</option>
              <option value="it">Information Technology</option>
              <option value="ds">Data Science</option>
              <option value="ai">Artificial Intelligence</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Documents</legend>

            <label for="resume">Upload Resume:</label>

            <input
              type="file"
              id="resume"
              name="resume"
              accept=".pdf,.doc,.docx"
            />
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label for="address">Address</label>
            <br />
            <textarea name="address" id="address" rows="5" cols="30"></textarea>
          </fieldset>
        </form>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>
      </main>
    </header>
  </body>
</html>
